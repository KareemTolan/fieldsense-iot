name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Build services
        run: |
          for p in FieldSense.Domain FieldSense.Ingestion FieldSense.Alerts FieldSense.DevicesApi; do
            dotnet build src/$p/$p.csproj -c Release
          done
      - name: Unit tests
        run: dotnet test tests/FieldSense.Domain.Tests/FieldSense.Domain.Tests.csproj -c Release --logger "console;verbosity=normal"

  simulator:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: simulator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware/esp32 } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: cp include/config.example.h include/config.h
      - run: pio run

  docker-images:
    runs-on: ubuntu-latest
    needs: [dotnet]
    strategy:
      matrix: { project: [FieldSense.Ingestion, FieldSense.Alerts, FieldSense.DevicesApi] }
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PROJECT=${{ matrix.project }} -f services/Dockerfile services
